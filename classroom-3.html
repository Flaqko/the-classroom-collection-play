<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Classroom 3</title>
  <link rel="stylesheet" href="style.css?v=password-select">
  <link rel="stylesheet" href="collection.css">
  <link rel="stylesheet" href="widescreen.css?v=controller-highlight">
  <link rel="stylesheet" href="sequel-title.css?v=unified-fades">
  <script type="module" src="src/classroom-3.js?v=unified-fades"></script>
</head>
<body class="classroom-three">
  <main class="classroom-layout">
    <div id="game-wrap">
      <svg id="stage" viewBox="0 0 300 400" role="application" aria-label="The Classroom 3 game" tabindex="0"></svg>
      <section id="third-title" class="sequel-title" aria-label="The Classroom 3 title menu" hidden>
        <svg class="sequel-title-logo" viewBox="0 0 280 106" role="img" aria-label="The Classroom 3">
          <image href="assets/classroom-3/logo-three-fingers.png" x="0" y="4" width="247" height="99"/>
          <path d="M235 42 Q253 26 266 32 Q279 41 261 52 Q253 57 245 57 Q264 54 271 65 Q277 80 256 85 Q244 88 231 81"
                fill="none" stroke="#0d0807" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M235 42 Q253 26 266 32 Q279 41 261 52 Q253 57 245 57 Q264 54 271 65 Q277 80 256 85 Q244 88 231 81"
                fill="none" stroke="#fa1210" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div id="third-play-options" class="sequel-title-options" style="--menu-rows: 5">
          <button type="button" data-action="newGame_button" aria-label="New Game"><svg aria-hidden="true"><use href="assets/classroom-2/title-labels.svg#play"/></svg></button>
          <button type="button" data-resume-menu aria-label="Continue" aria-describedby="resume-act-2" hidden><svg aria-hidden="true"><use href="assets/classroom-2/title-labels.svg#continue"/></svg><span id="resume-act-2" class="resume-act" role="tooltip"></span></button>
          <button type="button" data-action="password_button" aria-label="Passwords"><svg aria-hidden="true"><use href="assets/classroom-2/title-labels.svg#password"/></svg></button>
          <button type="button" data-action="tutorial_button" aria-label="Tutorial"><svg aria-hidden="true"><use href="assets/classroom-2/title-labels.svg#tutorial"/></svg></button>
          <button type="button" data-action="creditsButton" aria-label="Credits"><svg aria-hidden="true"><use href="assets/classroom-2/title-labels.svg#credits"/></svg></button>
          <button type="button" data-action="collectionBack" aria-label="Back"><svg aria-hidden="true"><use href="assets/classroom-2/title-labels.svg#back"/></svg></button>
        </div>
      </section>
      <section id="password-list" aria-labelledby="password-heading" hidden>
        <h2 id="password-heading">Passwords</h2>
        <ol></ol>
        <form>
          <input type="hidden" name="password">
          <button type="submit">Go</button>
        </form>
        <button type="button" id="close-passwords">Back</button>
      </section>
      <button id="pause-game" type="button" hidden>Pause</button>
      <button id="fullscreen" type="button" hidden>Fullscreen</button>
      <p class="game-status" id="third-status" role="status">Loading The Classroom 3…</p>
    </div>
  </main>
  <script type="module" src="src/widescreen.js?v=shared-fullscreen"></script>
</body>
</html>
