<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Classroom Collection</title>
  <link rel="stylesheet" href="collection.css">
  <link rel="stylesheet" href="widescreen.css?v=controller-highlight">
</head>
<body class="collection-page">
  <main class="collection-frame">
    <div class="collection">
      <h1><img class="collection-logo" src="assets/remaster/classroom-collection-logo.png" alt="The Classroom Collection"></h1>
      <nav class="game-list" aria-label="Choose a game">
        <a href="index.html?v=day10-door">The Classroom</a>
        <a href="classroom-2.html?v=next-focus">The Classroom 2</a>
        <a href="classroom-3.html?v=unified-fades">The Classroom 3</a>
      </nav>
    </div>
    <button type="button" class="collection-settings-trigger" aria-haspopup="dialog">Settings</button>
    <dialog class="collection-settings" aria-labelledby="collection-settings-heading">
      <h2 id="collection-settings-heading">Settings</h2>
      <button type="button" data-setting="fullscreen" autofocus>Fullscreen</button>
      <button type="button" data-setting="sound" aria-pressed="false">Sound off</button>
      <button type="button" data-setting="exit">Exit game</button>
      <p role="status" hidden></p>
    </dialog>
    <section class="collection-exit" hidden>
      <p>You can close this tab.</p>
      <button type="button">Return to collection</button>
    </section>
  </main>
  <script type="module" src="src/collection-shell.js?v=shared-fullscreen"></script>
</body>
</html>
